<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#edf1f5" />

    <!--
      Fraunces for headings — a warm, soft-edged serif with real personality,
      deliberately not one of the defaults that read as machine-generated
      (Inter, Poppins, Montserrat, Roboto). IBM Plex Sans and Mono underneath:
      humanist, drawn for technical work, and they sit well against Fraunces.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Christian Keough | Mechanical Engineering, Prosthetic Design &amp; Python</title>
    <meta
      name="description"
      content="Mechanical engineering student portfolio featuring SolidWorks design, prosthetics involvement, aerospace CAD, Python research tools, and an interest in computational biomechanics."
    />
    <meta name="author" content="Christian Keough" />

    <!--
      Open Graph. og:url and og:image MUST be absolute URLs — a relative path
      like "/og-image.png" is ignored by LinkedIn, Slack and iMessage, and the
      link preview comes out blank. Replace BOTH once you know your domain,
      and add the 1200x630 image at public/og-image.png.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Christian Keough" />
    <meta property="og:url" content="https://REPLACE-WITH-YOUR-DOMAIN.com/" />
    <meta property="og:title" content="Christian Keough | Mechanical Engineering, Prosthetic Design &amp; Python" />
    <meta
      property="og:description"
      content="Mechanical engineering student portfolio featuring SolidWorks design, prosthetics involvement, aerospace CAD, Python research tools, and an interest in computational biomechanics."
    />
    <meta property="og:image" content="https://REPLACE-WITH-YOUR-DOMAIN.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
